name: MoonLight Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run lexer tests
      run: |
        python -m pytest tests/test_lexer.py -v
    
    - name: Run parser tests
      run: |
        python -m pytest tests/test_parser.py -v
    
    - name: Run executor tests
      run: |
        python -m pytest tests/test_executor.py -v
    
    - name: Run integration tests
      run: |
        python -m pytest tests/test_integration.py -v
    
    - name: Run all tests with coverage
      run: |
        pip install pytest-cov
        python -m pytest tests/ --cov=. --cov-report=xml --cov-report=term
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  moonc-cpp-build:
    name: Build moonc (C++)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Install CMake
      uses: jwlawson/actions-setup-cmake@v1
      with:
        cmake-version: '3.20'

    - name: Configure moonc_cpp (no LLVM/CUDA for faster CI)
      run: |
        cd moonc_cpp
        cmake -B build \
          -DMOONLIGHT_WITH_LLVM=OFF \
          -DMOONLIGHT_WITH_CUDA=OFF \
          -DMOONLIGHT_BUILD_TESTS=OFF

    - name: Build moonc
      run: |
        cd moonc_cpp
        cmake --build build -j

    - name: Smoke test (parse subset examples)
      run: |
        cd moonc_cpp
        python run_subset_smoke.py
      continue-on-error: true

  benchmarks:
    name: Benchmarks (CI subset)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run CI benchmark subset
      run: python benchmarks/ci_benchmarks.py
      continue-on-error: true










